name: Release CD (Safe)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_to_testpypi:
        description: "Publish to TestPyPI"
        type: boolean
        default: false
      publish_to_pypi:
        description: "Publish to PyPI"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build_dist:
    name: Build + Validate Artifacts
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Validate package metadata
        run: twine check dist/*

      - name: Capture package version
        id: meta
        run: |
          VERSION=$(python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pepsy-dist-${{ steps.meta.outputs.version }}
          path: dist/*

  publish_testpypi:
    name: Publish to TestPyPI
    needs: build_dist
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_to_testpypi }}
    runs-on: ubuntu-latest
    environment: testpypi
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: pepsy-dist-${{ needs.build_dist.outputs.version }}
          path: dist

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish_pypi:
    name: Publish to PyPI
    needs: build_dist
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_to_pypi }}
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: pepsy-dist-${{ needs.build_dist.outputs.version }}
          path: dist

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
