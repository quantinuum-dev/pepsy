name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  agent-guidance:
    name: Agent guidance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate skill catalog
        run: python .github/skills/pepsy-maintainer/scripts/validate_catalog.py

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.12"
            profile: core
            extras: dev
          - python-version: "3.12"
            profile: extended
            # One full run covers optional backends across every domain,
            # including JAX checks outside the VMC test modules.
            extras: dev,test-extended,contraction,vmc
    runs-on: ubuntu-latest
    env:
      NUMBA_CACHE_DIR: /tmp/numba_cache_pepsy
      NUMBA_DISABLE_CACHING: "1"
      PYTHONPYCACHEPREFIX: /tmp/pycache_pepsy
      MPLCONFIGDIR: /tmp/mplconfig_pepsy
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Generate minimum core constraints
        if: matrix.profile == 'core'
        # Read floors from package metadata rather than maintain a second list.
        run: |
          python - <<'PY'
          import pathlib
          import tomllib

          project = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]
          requirements = project["dependencies"]
          assert all(">=" in requirement for requirement in requirements)
          pathlib.Path("/tmp/pepsy-minimum-core.txt").write_text(
              "\n".join(requirement.replace(">=", "==", 1) for requirement in requirements)
              + "\n"
          )
          PY
      - name: Install package (${{ matrix.profile }})
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.profile }}" = "core" ]; then
            python -m pip install -c /tmp/pepsy-minimum-core.txt -e ".[${{ matrix.extras }}]"
          else
            python -m pip install -e ".[${{ matrix.extras }}]"
          fi
          python -m pip check
      - name: Check optional backend imports
        if: matrix.profile == 'extended'
        # Catch incompatible upstream releases before the numerical suite.
        run: python -c "import jax, netket, symmray, torch; print('Optional backends imported successfully')"
      - name: Validate source syntax
        run: python -m compileall -q -f src tests
      - name: Check Python lint
        # Ruff's F rules cover the Pyflakes checks and honor noqa markers for
        # intentional lazy, type-only, and compatibility exports.
        run: python -m ruff check src/pepsy tests
      - name: Run core contracts and smoke tests
        if: matrix.profile == 'core'
        # Whole-package coverage is enforced by the extended suite below.
        run: python -m pytest -q -o addopts="" -m "smoke or (core and not optional and not slow)"
      - name: Run extended tests with coverage
        if: matrix.profile == 'extended'
        run: python -m pytest -q -o addopts="" --maxfail=1 --cov=pepsy --cov-report=term-missing --cov-fail-under=60
      - name: Report coverage after failure
        if: failure() && matrix.profile == 'extended'
        run: |
          if [ -f .coverage ]; then
            coverage_total="$(python -m coverage report --format=total --fail-under=0)"
            echo "::notice title=Coverage::${coverage_total}% (required: 60%)"
          fi

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install type-check dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run focused type checks
        run: python -m mypy src/pepsy/tensors/validation.py src/pepsy/vmc/api.py

  mpi:
    name: MPI (${{ matrix.ranks }} ranks)
    strategy:
      fail-fast: false
      matrix:
        ranks: [2, 3]
    runs-on: ubuntu-latest
    env:
      NUMBA_CACHE_DIR: /tmp/numba_cache_pepsy
      NUMBA_DISABLE_CACHING: "1"
      PYTHONPYCACHEPREFIX: /tmp/pycache_pepsy
      MPLCONFIGDIR: /tmp/mplconfig_pepsy
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install MPI runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y openmpi-bin libopenmpi-dev
      - name: Install MPI test profile
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,mpi,stabilizer]"
      - name: Run MPI unit-contract tests
        run: pytest -q -o addopts="" tests/test_mpi.py
      - name: Run multi-process MPI integration tests
        run: |
          mpiexec --oversubscribe --bind-to none -n ${{ matrix.ranks }} \
            python -m pytest -q -o addopts="" \
            tests/test_mpi_integration.py
      - name: Run MPI benchmark smoke test
        run: |
          mpiexec --oversubscribe --bind-to none -n ${{ matrix.ranks }} \
            python benchmarks/mpi_shots.py \
            --shots 8 --qubits 2 --depth 1 --chi 4 --workers auto

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build distributions
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python -m build --sdist --wheel
          python -m twine check dist/*
          version="$(python -c "import pathlib, tomllib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")"
          echo "Built Pepsy version: ${version}"
      - name: Smoke test wheel installation
        run: |
          smoke_dir="$(mktemp -d)"
          python -m venv "$smoke_dir/no-deps-venv"
          expected_version="$(python -c "import pathlib, tomllib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")"
          "$smoke_dir/no-deps-venv/bin/pip" install --no-deps dist/*.whl
          EXPECTED_VERSION="$expected_version" "$smoke_dir/no-deps-venv/bin/python" -c \
            "import importlib.metadata as md, os, pepsy; expected=os.environ['EXPECTED_VERSION']; actual=md.version('pepsy'); assert pepsy.__version__ == actual == expected; assert hasattr(pepsy, 'experimental')"
      - name: Smoke test base dependency installation
        run: |
          smoke_dir="$(mktemp -d)"
          python -m venv "$smoke_dir/venv"
          "$smoke_dir/venv/bin/pip" install dist/*.whl
          "$smoke_dir/venv/bin/python" -c \
            "import pepsy; import pepsy.backends, pepsy.boundary, pepsy.fitting, pepsy.interop, pepsy.solvers, pepsy.tensors"
          "$smoke_dir/venv/bin/python" -I - <<'PY'
          import numpy as np
          from pepsy.operators import x
          from pepsy.tensors import ps_to_mps, tn_norm

          state = ps_to_mps(2)
          state.gate_(x(), 0, contract=True)
          np.testing.assert_allclose(state.to_dense().reshape(-1), [0, 0, 1, 0])
          np.testing.assert_allclose(tn_norm(state, contraction_opt="greedy"), 1.0)
          PY
          "$smoke_dir/venv/bin/python" -X importtime -c "import pepsy" 2> "$smoke_dir/importtime.txt"
          tail -n 1 "$smoke_dir/importtime.txt"

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install documentation profile
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"
      - name: Build documentation
        run: python -m sphinx -q -b html docs docs/_build/html
