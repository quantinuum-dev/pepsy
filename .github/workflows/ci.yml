name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NUMBA_CACHE_DIR: /tmp/numba_cache_pepsy
      NUMBA_DISABLE_CACHING: "1"
      PYTHONPYCACHEPREFIX: /tmp/pycache_pepsy
      MPLCONFIGDIR: /tmp/mplconfig_pepsy
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Generate minimum core constraints
        # Read floors from package metadata rather than maintain a second list.
        run: |
          python - <<'PY'
          import pathlib
          import tomllib

          project = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]
          requirements = project["dependencies"]
          assert all(">=" in requirement for requirement in requirements)
          pathlib.Path("/tmp/pepsy-minimum-core.txt").write_text(
              "\n".join(requirement.replace(">=", "==", 1) for requirement in requirements)
              + "\n"
          )
          PY
      - name: Install core package and check tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c /tmp/pepsy-minimum-core.txt -e . pytest ruff mypy
          python -m pip check
      - name: Validate skill catalog
        run: python .github/skills/pepsy-maintainer/scripts/validate_catalog.py
      - name: Check Python lint
        # Ruff also parses the source and covers the Pyflakes F rules.
        run: python -m ruff check src/pepsy tests
      - name: Run focused type checks
        run: python -m mypy src/pepsy/tensors/validation.py src/pepsy/vmc/api.py
      - name: Run core contracts and smoke tests
        # Full optional-backend tests and coverage run in nightly.yml.
        run: python -m pytest -q -o addopts="" -m "smoke or (core and not optional and not slow)"

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build --sdist --wheel
          python -m twine check dist/*
          version="$(python -c "import pathlib, tomllib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")"
          echo "Built Pepsy version: ${version}"
      - name: Smoke test wheel installation
        run: |
          smoke_dir="$(mktemp -d)"
          python -m venv "$smoke_dir/no-deps-venv"
          expected_version="$(python -c "import pathlib, tomllib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")"
          "$smoke_dir/no-deps-venv/bin/pip" install --no-deps dist/*.whl
          EXPECTED_VERSION="$expected_version" "$smoke_dir/no-deps-venv/bin/python" -c \
            "import importlib.metadata as md, os, pepsy; expected=os.environ['EXPECTED_VERSION']; actual=md.version('pepsy'); assert pepsy.__version__ == actual == expected; assert hasattr(pepsy, 'experimental')"
      - name: Smoke test base dependency installation
        run: |
          smoke_dir="$(mktemp -d)"
          python -m venv "$smoke_dir/venv"
          "$smoke_dir/venv/bin/pip" install dist/*.whl
          "$smoke_dir/venv/bin/python" -c \
            "import pepsy; import pepsy.backends, pepsy.boundary, pepsy.fitting, pepsy.interop, pepsy.solvers, pepsy.tensors"
          "$smoke_dir/venv/bin/python" -I - <<'PY'
          import numpy as np
          from pepsy.operators import x
          from pepsy.tensors import ps_to_mps, tn_norm

          state = ps_to_mps(2)
          state.gate_(x(), 0, contract=True)
          np.testing.assert_allclose(state.to_dense().reshape(-1), [0, 0, 1, 0])
          np.testing.assert_allclose(tn_norm(state, contraction_opt="greedy"), 1.0)
          PY
          "$smoke_dir/venv/bin/python" -X importtime -c "import pepsy" 2> "$smoke_dir/importtime.txt"
          tail -n 1 "$smoke_dir/importtime.txt"

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install documentation profile
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"
      - name: Build documentation
        run: python -m sphinx -q -W --keep-going -b html docs docs/_build/html
