[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pepsy"
version = "0.1.1"
description = "Boundary-MPS tools for PEPS norm contraction and DMRG fitting"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
  "numpy",
  "quimb",
  "cotengra",
  "autoray",
  "tqdm",
]

[project.optional-dependencies]
torch = ["torch"]
solvers = ["scipy", "nlopt"]
viz = ["matplotlib"]
docs = ["sphinx>=7", "myst-parser>=2", "pydata-sphinx-theme>=0.15", "nbsphinx>=0.9"]
dev = ["pytest", "nbclient", "nbconvert"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["pepsy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = "/tmp/pytest_cache_pepsy"
