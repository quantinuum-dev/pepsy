[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pepsy"
version = "0.4.0"
description = "Tensor-network simulation, contraction, optimization, and VMC tools"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "numpy>=1.24",
  "quimb>=1.8",
  "cotengra>=0.6",
  "cotengrust>=0.1",
  "cmaes>=0.10",
  "autoray>=0.6",
  "tqdm>=4.65",
]

[project.urls]
Homepage = "https://github.com/quantinuum-dev/pepsy"
Repository = "https://github.com/quantinuum-dev/pepsy"
Issues = "https://github.com/quantinuum-dev/pepsy/issues"

[project.optional-dependencies]
torch = ["torch>=2.0"]
solvers = ["scipy>=1.10", "nlopt>=2.7"]
viz = ["matplotlib>=3.7"]
layout = ["nevergrad>=1.0"]
symmetry = ["symmray>=0.1"]
stabilizer = ["stim>=1.12"]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "pyflakes>=3",
  "mypy>=1.10",
  "ruff>=0.6",
  "build>=1.2",
  "twine>=5",
]
test-extended = [
  "matplotlib>=3.7",
  "nevergrad>=1.0",
  "nlopt>=2.7",
  "scipy>=1.10",
  "stim>=1.12",
  "symmray>=0.1",
  "torch>=2.0",
]
vmc-torch = ["torch>=2.0"]
vmc-netket = ["jax>=0.4", "flax>=0.8", "optax>=0.2", "netket>=3.10", "symmray>=0.1"]
vmc = ["torch>=2.0", "jax>=0.4", "flax>=0.8", "optax>=0.2", "netket>=3.10", "symmray>=0.1"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["pepsy*"]

[tool.setuptools.package-data]
pepsy = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = "/tmp/pytest_cache_pepsy"
addopts = "-m smoke"
markers = [
  "smoke: small deterministic contract checks for the default developer loop",
  "integration: extended optional-backend and domain-integration coverage",
  "slow: stress or long-running differential coverage",
]

[tool.coverage.run]
branch = true
source = ["pepsy"]

[tool.coverage.report]
fail_under = 30
exclude_also = [
  "if TYPE_CHECKING:",
  "pragma: no cover",
]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
follow_imports = "skip"
warn_unused_configs = true

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["history", "learning"]

[tool.ruff.lint]
select = ["F"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
